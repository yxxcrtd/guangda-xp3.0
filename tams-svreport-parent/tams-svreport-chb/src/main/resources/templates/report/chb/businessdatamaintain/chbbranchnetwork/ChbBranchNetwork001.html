<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>网点信息映射表管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<a id="ChbBranchNetwork001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
		        <a id="ChbBranchNetwork001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
		        <a id="ChbBranchNetwork001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
	         
	   		</div>
	   		<div class="joyin-form-wrap joyin-filter-form condition-area">
		        <form class="layui-form" id="searchForm">
		        	<div class="layui-form-item">
						<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable">网点编号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="branchNo" name="branchNo" class="layui-input form-input" placeholder="请输入内容">
							</div>
						</div>
						<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable">网点名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="branchName" name="branchName" class="layui-input form-input" placeholder="请输入内容">
							</div>
						</div>

						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" >网点所属监管</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="branchFsa" name="branchFsa"
										class="layui-input form-input input-select"
										data-th-data-result='${SVR_BANK_REGU_BURE2}' allowClear="true"
										placeholder="请输入内容"  data-th-placeholder="#{SysCommon.placeholder}"
										formatoption="true" >
									<option></option>
								</select>
							</div>
						</div>
		            </div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" >网点所属地区</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="networkNo" name="networkNo"
										class="layui-input form-input input-select"
										data-th-data-result='${SVR_BUY_PLACE}' allowClear="true"
										placeholder="请输入内容"  data-th-placeholder="#{SysCommon.placeholder}"
										formatoption="true" >
									<option></option>
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" >数据状态</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="status" name="status"
										class="layui-input form-input input-select select2-hidden-accessible" allowclear="true"
										placeholder="请选数据状态" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true" data-th-data-result="${MAINTAIN_STATUS}" formatoption = "true">
								</select>
							</div>
						</div>
					</div>
		        </form>
	        </div>
	        <div>
	            <table class="layui-table" id="dataTable"></table>
	        </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/chb/businessdatamaintain/chbbranchnetwork/ChbBranchNetwork001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
