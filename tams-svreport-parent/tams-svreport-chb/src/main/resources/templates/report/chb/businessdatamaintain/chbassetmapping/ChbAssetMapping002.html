<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>资产代码匹配映射管理</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form"  id="submitForm">
                <input type="text" name="uuid" data-th-value='${entity?.uuid}' hidden>

                <div class="layui-form-item" style="padding: 10px 0;">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">策略专户系统代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="sadasAssetCode" id="sadasAssetCode" required
                                   style=" width: 100%!important; display: inline-block;"
                                   data-th-value="${entity?.sadasAssetCode}" maxlength="50"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>

                <div class="layui-form-item" style="padding: 10px 0;">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">监管报送资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="svrAssetCode" name="svrAssetCode" class="layui-input form-input input-select"
                                    data-th-data-url='@{/chb/assetinfodetail/AssetInfoDetail001/getAssetCode}'
                                    data-th-initValue="${entity?.svrAssetCode}" placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true" required  >
                            </select>
                        </div>
                    </div>
                </div>


            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 40px 0 30px 0;">
                <div class="text-center">
                    <a id="ChbAssetMapping002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                    <a id="ChbAssetMapping002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/chb/businessdatamaintain/chbassetmapping/ChbAssetMapping002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
