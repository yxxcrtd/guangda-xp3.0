<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>网点信息映射表管理</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form"  id="submitForm">
                <div class="layui-form-item" style="padding: 10px 0;">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">网点编号</label>
                        <div class="layui-input-inline input-inline">

                            <input type="text" name="branchNo" id="branchNo" required
                                   style=" width: 100%!important; display: inline-block;"
                                   data-th-value="${entity?.branchNo}" maxlength="20"
                                   class="layui-input form-input" onKeyUp="value=value.replace(/[^\a-\z\A-\Z0-9]/g,'')" placeholder="请输入数字和英文组合"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" style="padding: 10px 0;">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">网点名称</label>
                        <div class="layui-input-inline input-inline">

                            <input type="text" name="branchName" id="branchName" required
                                   style=" width: 100%!important; display: inline-block;"
                                   data-th-value="${entity?.branchName}" maxlength="50"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" style="padding: 10px 0;">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">网点所属监管</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="branchFsa" name="branchFsa"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${SVR_BANK_REGU_BURE2}' allowClear="true" placeholder="请输入内容"
                                    data-th-initValue="${entity?.branchFsa}" required="required"
                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                                <option></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">网点地区码值</label>
                        <div class="layui-input-inline input-inline">
                            <input id="networkNo" name="networkNo"
                                   class="layui-input form-input input-select"
                                   data-th-data-result='${SVR_BUY_PLACE}' placeholder="请输入内容"
                                   data-th-value="${entity?.networkNo}"
                                   required="required" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 40px 0 30px 0;">
                <div class="text-center">
                    <a id="ChbBranchNetwork002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                    <a id="ChbBranchNetwork002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/chb/businessdatamaintain/chbbranchnetwork/ChbBranchNetwork002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
