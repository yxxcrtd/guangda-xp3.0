<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>资产代码匹配映射管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<a id="ChbAssetMapping001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
<!--
				<a id="ChbAssetMapping001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
-->
		        <!--<a id="ChbAssetMapping001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>-->

	   		</div>
	   		<div class="joyin-form-wrap joyin-filter-form condition-area">
		        <form class="layui-form" id="searchForm">
		        	<div class="layui-form-item">

						<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable">报送系统资产名称</label>
							<div class="layui-input-inline input-inline">
								<select id="svrAssetCode" class="input-select"
										data-th-data-url='@{/chb/assetinfodetail/AssetInfoDetail001/getAssetCode}'
										initvalue="" placeholder="请选择"
										data-th-placeholder="#{SysCommon.selectplaceholder}"
										allowClear="true" multiple="multiple">
								</select>

							</div>
						</div>

						<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable">策略专户系统代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="sadasAssetCode" name="sadasAssetCode" class="layui-input form-input" placeholder="请输入内容">
							</div>
						</div>




		            </div>

		        </form>
	        </div>
	        <div>
	            <table class="layui-table" id="dataTable"></table>
	        </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/chb/businessdatamaintain/chbassetmapping/ChbAssetMapping001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
