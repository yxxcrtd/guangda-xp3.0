<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<meta charset="UTF-8">
<title data-th-text="#{ChbMstCounterParty001}">交易对手信息</title>
</head>
<body>
	<div layout:fragment="content">
		<!-- 画面内容 -->
		<div class="form-button-area" >
			<a id="ChbMstCounterParty001_btn_add" class="layui-btn layui-btn-sm btn-create"
			   data-th-text="#{SysCommon.create}">新建</a>
			<a id="ChbMstCounterParty001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
			   data-th-text="#{SysCommon.delete}">删除</a>
			<a id="ChbMstCounterParty001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">

				<div class="layui-form-item">
					<!--<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" data-th-text="#{ChbMstCounterParty001.counterType}">交易对手类别</label>
						<div class="layui-input-inline input-inline">
							<select id="counterType" class="input-select" data-th-data-result='${MST_COUNTER_TYPE}' placeholder="请选择"
									data-th-initvalue="${counterType}"  data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>-->
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" >交易对手报送字段</label>
                        <div class="layui-input-inline input-inline">
                            <select id="counterName" class="input-select"
                                    data-th-data-url='@{/report/chb/businessdatamaintain/chbmstcounterparty/ChbMstCounterParty001/getCounterName}'
                                    initvalue="" placeholder="请选择"  formatoption = "false"
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true" >
                            </select>

                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{ChbMstCounterParty001.counterType2}">交易对手类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="counterType2" class="input-select" data-th-data-result='${SVR_CUSTOMER_TYPE2}' placeholder="请选择"
                                    data-th-initvalue="${counterType2}"  data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                            </select>
                        </div>
                    </div>

					<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" >数据状态</label>
						<div class="layui-input-inline input-inline">
							<select id="status" class="input-select" data-th-data-result='${MAINTAIN_STATUS}' placeholder="请选择"  data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" >
							</select>
						</div>
					</div>
					</div>
			</form>
		</div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
	</div>

	<div layout:fragment="script">
		<script data-th-src="@{/js/report/chb/businessdatamaintain/chbmstcounterparty/ChbMstCounterParty001.js}"
				type="text/javascript"></script>
	</div>
</body>
</html>
