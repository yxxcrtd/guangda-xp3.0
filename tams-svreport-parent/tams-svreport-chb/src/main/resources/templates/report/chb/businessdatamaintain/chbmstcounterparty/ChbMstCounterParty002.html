<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{ChbMstCounterParty002}">新建交易对手信息</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input type="text" name="uuid" data-th-value='${entity?.uuid}' hidden>
        <input type="text" name="info" data-th-value='${entity?.info}' hidden>
        <input type="text" id="workflowId" name="workflowId" data-th-value='${entity?.workflowId}' hidden>
            <div class="pro-module-item">
                <div class="layui-form-item">
                    <input type="text" id="counterType" name="counterType" value="02" hidden/>
                    <!--<div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{ChbMstCounterParty001.counterType}">交易对手类别</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="counterType" name="counterType" class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${MST_COUNTER_TYPE}'
                                   data-th-value = "${entity?.counterType}"
                                   required >
                        </div>
                    </div>-->


                    <div class="layui-inline layui-col-md4" >
                        <label class="layui-form-label form-lable">交易对手识别标识</label>
                        <div class="layui-input-inline input-inline">
                            <input id="counterId" name="counterId" class="layui-input form-input"  data-th-value='${entity?.counterId}' required/>
                        </div>

                    </div>
                    <div class="layui-inline layui-col-md4" id="type02">
                        <label class="layui-form-label form-lable">交易对手报送字段</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="counterName" name="counterName"
                                   class="layui-input form-input input-lenovoselect " placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value = "${entity?.counterName}"
                                   data-th-data-url="@{/report/chb/businessdatamaintain/chbmstcounterparty/ChbMstCounterParty002/getRivalPartyName}"
                                   data-idfield="code" data-keyfield="code"
                                   data-th-data-effectivefieldsalias='|{"code":"产品名称","shortName":"产品名称"}|'>

                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{ChbMstCounterParty001.counterType2}">交易对手类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="counterType2" name="counterType2" class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${SVR_CUSTOMER_TYPE2}'
                                   data-th-value = "${entity?.counterType2}"
                                   required >
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">


                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">关联交易情况</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="relatedTradeStatus" name="relatedTradeStatus" class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${SVR_RELATED_TRADE_STATUS}'
                                   data-th-value = "${entity?.relatedTradeStatus}"
                                   required >
                        </div>
                    </div>


                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{ChbMstCounterParty001.remark}">备注</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="remark" name="remark"
                                   class="layui-input form-input" maxlength="30"
                                   data-th-value="${entity?.remark}" >
                        </div>
                    </div>
                </div>
            </div>
    </form>
    <div class="layui-col-md11" style="margin: 10px;">
        <div class="text-center">
            <a id="ChbMstCounterParty002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
            <a id="ChbMstCounterParty002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
   <script data-th-inline="javascript" type="text/javascript">
       var counterName55 = [[${entity?.counterName5}]];
       var counterName11 = [[${entity?.counterName1}]];
    </script>
    <script data-th-src="@{/js/report/chb/businessdatamaintain/chbmstcounterparty/ChbMstCounterParty002.js}"
            type="text/javascript"></script>
</div>

</body>
</html>
