<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title >数据检查规则配置新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >规则编码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="ruleId" id="ruleId"
                           class="layui-input form-input" maxlength="130"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.ruleId}"
                           required>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >规则大类</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" th:id="ruleClassify" th:name="ruleClassify"
                           data-th-initValue="${entity?.ruleClassify}"
                           class="layui-input form-input input-select"
                           data-th-data-result="${RULE_CLASSIFY}"
                            required></select>
                </div>
                <!--data-th-value="${entity?.ruleClassify}"-->
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >规则类型</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" th:id="ruleType" th:name="ruleType"
                            data-th-initValue='${entity?.ruleType}'
                           class="layui-input form-input input-select"
                           data-th-data-result="${RULE_TYPE}"
                            required></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >报表名称</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" th:id="tableDataName" th:name="tableDataName"
                           data-th-initValue='${entity?.tableDataName}'
                           class="layui-input form-input input-select"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-data-result="${DATA_COLLECT_REPORT_TYPE}"
                            required></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >关联报表</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" th:id="relatedTable" th:name="relatedTable"
                           class="layui-input form-input"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.relatedTable}"
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >检查字段名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="checkedFieldName" id="checkedFieldName"
                           class="layui-input form-input" maxlength="130"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.checkedFieldName}"
                           required>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >检查字段对应表名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="checkedFiledValue" id="checkedFiledValue"
                           class="layui-input form-input" maxlength="130"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.checkedFiledValue}" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >规则方法</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" th:id="ruleMethod" th:name="ruleMethod"
                           data-th-initValue='${entity?.ruleMethod}'
                           class="layui-input form-input input-select"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-data-result="${RULE_METHOD}"
                            ></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >规则标识</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" th:id="ruleIdentify" th:name="ruleIdentify"
                           data-th-initValue='${entity?.ruleIdentify}'
                           class="layui-input form-input input-select"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-data-result="${RULE_IDENTIFY}"
                            required></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >规则参数</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="ruleParam" id="ruleParam"
                           class="layui-input form-input" maxlength="130"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.ruleParam}"
                           required>
                </div>
            </div>

            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >人行要素编码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="pbcAssetCode" id="pbcAssetCode"
                           class="layui-input form-input" maxlength="130"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.pbcAssetCode}" >
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >参数1</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="PARAMS01" id="PARAMS01"
                           class="layui-input form-input" maxlength="130"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.PARAMS01}">
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >参数2</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="PARAMS02" id="PARAMS02"
                           class="layui-input form-input" maxlength="130"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.PARAMS02}">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >参数3</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="PARAMS03" id="PARAMS03"
                           class="layui-input form-input" maxlength="130"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.PARAMS03}">
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >参数4</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="PARAMS04" id="PARAMS04"
                           class="layui-input form-input" maxlength="130"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.PARAMS04}">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div>
                <label class="layui-form-label form-lable"  style='width: 19%;'>规则内容</label>
                <div class="layui-input-inline input-inline" style="width: 80%!important;">
                    <textarea id="ruleContent" name="ruleContent"
                              class="layui-input form-input layui-textarea"
                              th:value="${entity?.ruleContent}"
                              data-th-text="${entity?.ruleContent}"
                              placeholder="请输入内容"
                              data-th-placeholder="#{SysCommon.placeholder}"
                              required>
                    </textarea>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div>
                <label class="layui-form-label form-lable"  style='width: 19%;'>提示语</label>
                <div class="layui-input-inline input-inline" style="width: 80%!important;">
                    <textarea id="rulePrompt" name="rulePrompt"
                              class="layui-input form-input layui-textarea"
                              th:value="${entity?.rulePrompt}"
                              data-th-text="${entity?.rulePrompt}"
                              placeholder="请输入内容"
                              data-th-placeholder="#{SysCommon.placeholder}"
                              required>
                    </textarea>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable" >是否启动</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" th:id="isstart" th:name="isstart"
                           data-th-initValue='${entity?.isstart}'
                           class="layui-input form-input input-select"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-data-result="${ISSTART}"
                            required></select>
                </div>
            </div>
        </div>
    </form>
    <div class="text-cerow text-center" style="margin: 10px;">
        <a id="PbcCheckRuleInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
        <a id="PbcCheckRuleInfo00_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    </script>
    <script data-th-src="@{/js/svreport/pbc/checkRuleInfo/PbcCheckRuleInfo002.js}" type="text/javascript"></script>
</div>
</body>
</html>
