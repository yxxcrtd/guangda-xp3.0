<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title >数据校验信息维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="PbcCheckRuleInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="PbcCheckRuleInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
            <a id="PbcCheckRuleInfo001_btn_effective" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-startup"></i>启用</a>
            <a id="PbcCheckRuleInfo001_btn_neffective" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-stopit"></i>禁用</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >规则大类</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="ruleClassify" name="ruleClassify"
                                   class="layui-input form-input input-select"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result="${RULE_CLASSIFY}"
                                   allowClear="true" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">报表名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="tableDataName" id="tableDataName"
                                    class="input-select"
                                    data-th-data-result='${DATA_COLLECT_REPORT_TYPE}'
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    allowClear="true"
                                    multiple="multiple" >
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >检查字段名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="checkedFieldName" name="checkedFieldName"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true">
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >规则编码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="ruleId" name="ruleId"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">规则类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="ruleType" id="ruleType"
                                    class="input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${RULE_TYPE}'
                                    allowClear="true"
                                    multiple="multiple" >
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >是否启用</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="isstart" name="isstart"
                                   class="layui-input form-input input-select"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result="${ISSTART}"
                                   allowClear="true" />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >规则详细内容</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="ruleContent" name="ruleContent"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >错误信息提示</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="rulePrompt" name="rulePrompt"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true">
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >人行要素编码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="pbcAssetCode" name="pbcAssetCode"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >规则标识</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="ruleIdentify" name="ruleIdentify"
                                   class="layui-input form-input input-select"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result="${RULE_IDENTIFY}"
                                   allowClear="true" />
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/svreport/pbc/checkRuleInfo/PbcCheckRuleInfo001.js}"
            type="text/javascript"></script>
    <script data-th-inline="javascript" type="text/javascript">
    </script>
</div>
</body>
</html>
