<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>

<title data-th-text="#{ZG08SpeCounterQuity}">ZG08 特定目的载体交易对手明细信息</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="form-button-area" export="false">
			<a id="ZG08SpeCounterQuity_btn_checkData" class="layui-btn layui-btn-sm btn-default">
				<i class="iconfont icon-sent"></i>数据检查</a>
			<a id="ZG08SpeCounterQuity_btn_manual"
			   class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>手工处理</a>
			<a id="ZG08SpeCounterQuity_btn_cancelManual"
			   class="layui-btn layui-btn-sm btn-default">取消手工处理</a>
			<a id="ZG08SpeCounterQuity_btn_export"
			   class="layui-btn layui-btn-sm btn-export btn-default">导出人行excel</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">产品代码</label>
						<div class="layui-input-inline input-inline">
							<select id="pbcProdId" name="pbcProdId"
								data-th-data-url='@{/pbc/classic/manuallygeneratingpbcdata/ManuallyGeneratingPbcData001/getPbcColProdId}'
								data-th-data-formatoption=true class="input-select"
								placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
						<!--<div class="layui-input-inline input-inline">
							<input id="pbcProdId" name="pbcProdId" class="layui-input form-input input-lenovoselect"
								   data-th-data-parentids="pbcProdId" data-th-data-code="pbcProdId" placeholder="请输入"
								   data-th-data-url="@{/pbc/zg08specounterequity/ZG08SpeCounterQuity/getProd}"
								   data-idfield="code" data-keyfield="code"
								   data-showindex = 'false'
								   data-effectivefieldsalias='{"code":"产品代码","shortName":"产品名称"}'
							>
						</div>-->
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">交易对手产品代码</label>
						<div class="layui-input-inline input-inline">
							<input id="prrtyProdId" name="prrtyProdId" class="layui-input form-input input-lenovoselect"
								   data-th-data-parentids="pbcProdId" data-th-data-code="pbcProdId" placeholder="请输入"
								   data-th-data-url="@{/pbc/zg08specounterequity/ZG08SpeCounterQuity/getCounterProd}"
								   data-idfield="code" data-keyfield="code"
								   data-showindex = 'false'
								   data-effectivefieldsalias='{"code":"产品代码","shortName":"产品名称"}'
							>
<!--
							<input id="prrtyProdId" name="prrtyProdId" type="text" class="layui-input form-input input-lenovoselect" maxlength="30" placeholder="请输入关键词" data-th-placeholder="#{SysCommon.placeholder}">
-->
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">资产负债项目</label>
						<div class="layui-input-inline input-inline">
							<select id="assetType" name="assetType"
									class="layui-input form-input input-select"
									data-th-data-result='${PBC_ASSET_LIAB_PROJ}'
									data-th-initvalue="${assetType}" placeholder="请选择"
									data-th-placeholder="#{SysCommon.selectplaceholder}"
									allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">统计年月</label>
						<div class="layui-input-inline input-inline">
							<!--<input id="termId" type="text" name="termId"
								   class="layui-input form-input timeControl input-dateRangeSelect"
								   placeholder="请选择日期区间" />-->
							<!--<input id="termId" type="text"  name="timeControl"  class="layui-input form-input input-dateSelect"
								   placeholder="请选择年月" />-->
							<!--<div class="layui-input-inline">
								<input type="text" class="layui-input form-input input-dateSelect" id="termId" placeholder="请选择年月">
							</div>-->
							<!--<div class="layui-input-inline input-inline">
								<input id="termId" type="text"  name="timeControl"  class="layui-input form-input input-dateSelect"
									   placeholder="请选择年月" />
							</div>-->
							<input id="termId" type="text"  name="timeControl"  class="layui-input form-input input-dateSelect"
								   placeholder="请选择年月" />
						</div>
					</div>
					<!--<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">统计年月</label>
						<div class="layui-input-inline input-inline">
							<input id="enddate" type="text"  name="timeControl"  class="layui-input form-input"
								   placeholder="请选择年月" />
						</div>
					</div>-->
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">报送状态</label>
						<div class="layui-input-inline input-inline">
							<select id="sendStatus" name="sendStatus"
									class="layui-input form-input input-select"
									data-th-data-result='${PBC_SUBMIT_STATUS}'
									data-th-initvalue="${submitStatus}" placeholder="请选择"
									data-th-placeholder="#{SysCommon.selectplaceholder}"
									allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">报送日期</label>
						<div class="layui-input-inline input-inline">
							<input id="submitTime" type="text" name="timeControl"
								   class="layui-input form-input timeControl input-dateRangeSelect"
								   placeholder="请选择日期区间" />
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">报送截止日</label>
						<div class="layui-input-inline input-inline">
							<input id="pbcSubmitDeadline" type="text" name="timeControl"
								class="layui-input form-input timeControl input-dateRangeSelect"
								placeholder="请选择日期区间" />
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">数据日期</label>
						<div class="layui-input-inline input-inline">
							<input id="statusDate" type="text" name="timeControl"
								class="layui-input form-input timeControl input-dateRangeSelect"
								placeholder="请选择日期区间" />
						</div>
					</div>
				</div>
			</form>
		</div>

		<div>
			<table class="layui-table" id="dataTable">
			</table>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var isMain = /*[[${isMain}]]*/'';
			var searchDataStart = /*[[${searchDataStart}]]*/'';
			var searchDataEnd = /*[[${searchDataEnd}]]*/'';
			var submitStatus = /*[[${submitStatus}]]*/'';
			var checkUrl = '/pbc/zg08specounterequity/ZG08SpeCounterQuity/reportCheck';
			var dataTitle = '<h4 class="modal-title" id="myModalLabel">ZG08 特定目的载体交易对手明细信息数据检查 </h4>';

			layui.use('laydate', function() {
				var laydate = layui.laydate;
				laydate.render({
					elem: '#termId',
					type: 'month',
					format: 'yyyy-MM'
				});
			})
		</script>
		<script
			data-th-src="@{/js/report/pbc/classic/zg08specounterequity/ZG08SpeCounterQuity.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
	</div>
</body>
</html>
