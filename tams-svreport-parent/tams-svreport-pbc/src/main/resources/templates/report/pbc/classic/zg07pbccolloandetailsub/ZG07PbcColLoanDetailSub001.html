<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">

<head>

    <title data-th-text="#{ZG07PbcColLoanDetailSub001}">ZG07 除回购和拆解外贷款明细登记表</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
            <a id="ZG07PbcColLoanDetailSub001_btn_checkData" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-sent"></i>数据检查</a>
            <a id="ZG07PbcColLoanDetailSub001_btn_manual" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>手工处理</a>
            <a id="ZG07PbcColLoanDetailSub001_btn_cancelManual" class="layui-btn layui-btn-sm btn-default">取消手工处理</a>
            <a id="ZG07PbcColLoanDetailSub001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出人行excel</a>
        </div>

        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="#{ZG07PbcColLoanDetailSub001.pbcProdId}">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="pbcProdId" name="pbcProdId"
                                    class="layui-input form-input input-select"
                                    data-th-data-url='@{/pbc/classic/manuallygeneratingpbcdata/ManuallyGeneratingPbcData001/getPbcColProdId}'
                                    data-th-data-formatoption=true
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true">
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="#{ZG07PbcColLoanDetailSub001.assetCode}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="assetCode" name="assetCode"
                                    class="layui-input form-input input-select"
                                    data-th-data-url='@{/chb/assetinfodetail/AssetInfoDetail001/getAssetCode}'
                                    data-th-data-formatoption=true
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true">
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="#{ZG07PbcColLoanDetailSub001.loansType}">贷款种类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="loansType" name="loansType"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${SVR_LOAN_TYPE}'
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true">
                            </select>
                        </div>
                    </div>

                </div>

                <div class="layui-form-item">

                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="#{ZG07PbcColLoanDetailSub001.termid}">统计年月</label>
                        <div class="layui-input-inline input-inline">
                            <input id="termid" name="timeControl"
                                   class="layui-input form-input input-dateSelect"
                                   placeholder="请选择年月" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="#{ZG07PbcColLoanDetailSub001.sendStatus}">报送状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="sendStatus" name="sendStatus"
                                    class="layui-input form-input input-select"
                                    data-th-initvalue="${submitStatus}"
                                    data-th-data-result='${PBC_SUBMIT_STATUS}'
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true">
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="#{ZG07PbcColLoanDetailSub001.submitTime}">报送日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="submitTime" type="text" name="timeControl"
                                   class="layui-input form-input timeControl input-dateRangeSelect"
                                   placeholder="请选择日期区间" />
                        </div>
                    </div>

                </div>

                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="#{ZG07PbcColLoanDetailSub001.submitDeadline}">报送截止日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="pbcSubmitDeadline" type="text" name="pbcSubmitDeadline"
                                   class="layui-input form-input timeControl input-dateRangeSelect"
                                   placeholder="请选择日期区间" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="#{ZG07PbcColLoanDetailSub001.statusDate}">数据日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="statusDate" name="timeControl"
                                   class="layui-input form-input timeControl input-dateRangeSelect"
                                   placeholder="请选择日期区间" />
                        </div>
                    </div>

                </div>
            </form>
        </div>

        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var isMain = /*[[${isMain}]]*/'';
            var searchDataStart = /*[[${searchDataStart}]]*/'';
            var searchDataEnd = /*[[${searchDataEnd}]]*/'';
            var submitStatus = /*[[${submitStatus}]]*/'';
            var checkUrl = '/pbc/zg07pbccolloandetailsub/ZG07PbcColLoanDetailSub001/reportCheck';
            var dataTitle = '<h4 class="modal-title" id="myModalLabel"> ZG07 除回购和拆借外贷款明细信息数据检查 </h4>';


            layui.use('laydate', function () {
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#termid',
                    type: 'month',
                    format: 'yyyy-MM'
                });
            })
        </script>
        <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
        <script type="text/javascript" data-th-src="@{/js/report/pbc/classic/zg07pbccolloandetailsub/ZG07PbcColLoanDetailSub001.js}"></script>

    </div>
</body>

</html>
