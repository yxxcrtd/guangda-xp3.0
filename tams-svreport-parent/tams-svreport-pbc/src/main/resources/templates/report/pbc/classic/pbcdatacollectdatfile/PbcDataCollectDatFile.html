<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">

<head>
    <title data-th-text="#{PbcDataCollectDatFile.title}">人行报送文件管理（大数据采集平台）</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
			<a id="PbcDataCollectDatFile_btn_sendFileDownLoad" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>下载DAT文件</a>
			<a id="PbcDataCollectDatFile_btn_staticTemplateImport" class="layui-btn layui-btn-sm btn-export btn-default">导入人行EXCEL</a>
		</div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md3">
						<label class="layui-form-label form-lable">报表名称</label>
						<div class="layui-input-inline input-inline">
							<select id="reportName" class="input-select"
								data-th-data-result='${DATA_COLLECT_REPORT_TYPE}'
								data-th-initvalue="${reportName}" placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md3">
						<label class="layui-form-label form-lable">生成日期</label>
						<div class="layui-input-inline input-inline">
							<input id="createDate" type="text"
								   name="createDate"
								   class="layui-input form-input input-dateRangeSelect"
								   placeholder="请选择日期区间" data-th-value="|${sysdateStrStart} - ${sysdateStrEnd}|"/>
						</div>
					</div>

					<div class="layui-inline layui-col-md3">
						<label class="layui-form-label form-lable">报送状态</label>
						<div class="layui-input-inline input-inline">
							<select id="reportStatus" class="input-select"
									data-th-data-result='${PBC_SUBMIT_STATUS}'
									data-th-initvalue="${reportStatus}" placeholder="请选择"
									data-th-placeholder="#{SysCommon.selectplaceholder}"
									allowClear="true" >
							</select>
						</div>
					</div>

				</div>
				<div class="layui-form-item" style="height: 26px">
				</div>
			</form>
		</div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
								</script>
        <script data-th-src="@{/js/report/pbc/classic/pbcdatacollectdatfile/PbcDataCollectDatFile.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    </div>
</body>

</html>
