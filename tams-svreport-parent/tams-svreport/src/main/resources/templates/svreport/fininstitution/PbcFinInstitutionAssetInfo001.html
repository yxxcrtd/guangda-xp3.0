<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title>表内资产数据维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="PbcFinInstitutionAssetInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="PbcFinInstitutionAssetInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
            <!--<a id="PbcFinInstitutionAssetInfo001_btn_import" class="layui-btn layui-btn-sm btn-import"><i class="iconfont icon-import"></i>导入</a>-->
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">统计年月</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="termId" id="termId"
                                   class="layui-input form-input input-dateSelect"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${TERM_DATE}"
                                   allowClear="true" />
                        </div>
                    </div>

                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/svreport/fininstitution/PbcFinInstitutionAssetInfo001.js}" type="text/javascript"></script>
    <script data-th-inline="javascript" type="text/javascript">
        layui.use('laydate', function () {
            var laydate = layui.laydate;
            laydate.render({
                elem: '#termId',
                type: 'month',
                format: 'yyyy-MM'
            });
        })
    </script>
</div>
</body>
</html>
