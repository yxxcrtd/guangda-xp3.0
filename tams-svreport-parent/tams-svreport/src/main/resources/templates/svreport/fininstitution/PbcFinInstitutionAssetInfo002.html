<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title>表内资产数据维护</title>
</head>
<body>
<div layout:fragment="content">

    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input type="text" name="uuid" id="pbcUuid" data-th-value='${entity?.pbcUuid}' hidden>

        <div class="pro-module-wrap">
            <div class="pro-module">
                <div class="pro-module-item">

                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">统计年月</label>
                            <div class="layui-input-inline input-inline">
                                <input name="termId" id="termId"
                                        class="layui-input form-input input-dateSelect"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-value="${entity?.termId}"
                                        data-th-required="true" />
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">金融机构表内资产余额（本外币）</label>
                            <div class="layui-input-inline input-inline">
                                <input name="finAssetBalance" id="finAssetBalance"
                                       class="layui-input form-input text-money" maxlength="20"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.finAssetBalance}"
                                       data-textrange="2"
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">金融机构表内金融资产余额（本外币）</label>
                            <div class="layui-input-inline input-inline">
                                <input id="finInsAssetBalance" name="finInsAssetBalance"
                                       class="layui-input form-input text-money" maxlength="20"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.finInsAssetBalance}"
                                       data-textrange="2"
                                       data-th-required="true" />
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </form>
    <div class="text-cerow text-center" style="margin: 10px;">
        <a id="PbcFinInstitutionAssetInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
        <a id="PbcFinInstitutionAssetInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        layui.use('laydate', function () {
            var laydate = layui.laydate;
            laydate.render({
                elem: '#termId',
                type: 'month',
                format: 'yyyy-MM'
            });
        })
    </script>
    <script data-th-src="@{/js/svreport/fininstitution/PbcFinInstitutionAssetInfo002.js}" type="text/javascript"></script>
</div>
</body>
</html>
