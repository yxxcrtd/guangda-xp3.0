<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{PbcSpecificInvestorsHold002}">特定目的载体持有信息维护(投资者)新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input type="text" name="uuid" id="uuid" data-th-value='${entity?.uuid}' hidden>
        <input type="text" name="status" id="status" data-th-value='${entity?.status}' hidden>

        <div class="pro-module-wrap">
            <div class="pro-module">
                <div class="pro-module-item">

                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificInvestorsHold002.account}">内部产品代码</label>
                            <div class="layui-input-inline input-inline">
                                <select name="account" id="account"
                                        class="layui-input form-input input-select" maxlength="101"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-initvalue="${entity?.account}"
                                        data-th-data-url="@{/svreport/specificinvestorshold/PbcSpecificInvestorsHold002/getProdInsId}"
                                        data-th-required="true" >
                                </select>
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificInvestorsHold002.pbcProdId}">人行产品代码</label>
                            <div class="layui-input-inline input-inline">
                                <input name="pbcProdId" id="pbcProdId"
                                       class="layui-input form-input" maxlength="16"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-initvalue="${entity?.pbcProdId}"
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificInvestorsHold002.indentifyMark}">识别标识</label>
                            <div class="layui-input-inline input-inline">
                                <input id="indentifyMark" name="indentifyMark"
                                       class="layui-input form-input input-lenovoselect" maxlength="31"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.indentifyMark}"
                                       data-th-data-url="@{/svreport/specificinvestorshold/PbcSpecificInvestorsHold002/getIndentifyMark}"
                                       data-idfield="code" data-keyfield="code"
                                       data-showindex = 'false'
                                       data-effectivefieldsalias='{"code":"识别标识","shortName":"投资者名称"}'
                                       data-th-required="true" />
                            </div>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificInvestorsHold002.holderName}">投资者名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="holderName" th:name="holderName"
                                       class="layui-input form-input" maxlength="201"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.holderName}"
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificInvestorsHold002.holderType}">投资者类别</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="holderType" th:name="holderType"
                                       class="layui-input form-input input-select"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.holderType}"
                                       data-th-data-result="${HOLDER_TYPE}"
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificInvestorsHold002.holdDate}">持有日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="holdDate" th:name="holdDate"
                                       class="layui-input form-input input-dateSelect"
                                       data-th-value="${#dates.format(entity?.holdDate,'yyyy-MM-dd')}"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-required="true" />
                            </div>
                        </div>

                    </div>

                    <div class="layui-form-item">

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificInvestorsHold002.ccy}">币种</label>
                            <div class="layui-input-inline input-inline">
                                <input id="ccy" name="ccy"
                                       class="layui-input form-input input-select"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.ccy}"
                                       data-th-data-result="${CURRENCY_CHB}"
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificInvestorsHold002.qty}">持有份额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="qty" th:name="qty"
                                       class="layui-input form-input text-money"
                                       data-textrange="2"
                                       data-th-value="${entity?.qty}"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificInvestorsHold002.amount}">持有金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="amount" th:name="amount"
                                       class="layui-input form-input text-money"
                                       data-textrange="2"
                                       data-th-value="${entity?.amount}"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-required="true" />
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </form>
    <div class="text-cerow text-center" style="margin: 10px;">
        <a id="PbcSpecificInvestorsHold002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
        <a id="PbcSpecificInvestorsHold002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    </script>
    <script data-th-src="@{/js/svreport/specificinvestorshold/PbcSpecificInvestorsHold002.js}" type="text/javascript"></script>
</div>
</body>
</html>
