<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{PbcSpecificInvestorsHold001}">特定目的载体持有信息维护(投资者)</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="PbcSpecificInvestorsHold001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="PbcSpecificInvestorsHold001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
            <a id="PbcSpecificInvestorsHold001_btn_import" class="layui-btn layui-btn-sm btn-import"><i class="iconfont icon-import"></i>导入</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificInvestorsHold001.account}">内部产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="account" id="account"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificInvestorsHold001.pbcProdId}">人行产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="pbcProdId" id="pbcProdId"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificInvestorsHold001.indentifyMark}">识别标识</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="indentifyMark" name="indentifyMark"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true">
                        </div>
                    </div>

                </div>

                <div class="layui-form-item">

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificInvestorsHold001.holderName}">投资者名称</label>
                        <div class="layui-input-inline input-inline">
                            <input name="holderName" id="holderName"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificInvestorsHold001.holdDate}">持有日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="holdDate" id="holdDate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${holdDataStart} + ' - ' + ${holdDataEnd}"
                                   allowClear="true" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificInvestorsHold001.status}">数据状态</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="status" id="status"
                                   class="layui-input form-input input-select"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result="${MAINTAIN_STATUS}"
                                   allowClear="true" />
                        </div>
                    </div>

                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/svreport/specificinvestorshold/PbcSpecificInvestorsHold001.js}"
            type="text/javascript"></script>
    <script data-th-inline="javascript" type="text/javascript">

    </script>
</div>
</body>
</html>
