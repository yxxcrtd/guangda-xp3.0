<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{PbcSpecificCounterParty001}">特定目的载体对手方信息维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="PbcSpecificCounterParty001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="PbcSpecificCounterParty001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
            <a id="PbcSpecificCounterParty001_btn_import" class="layui-btn layui-btn-sm btn-import"><i class="iconfont icon-import"></i>导入</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificCounterParty001.partyOrgName}">交易对手机构名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="partyOrgName" id="partyOrgName"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificCounterParty001.partyProdName}">交易对手产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="partyProdName" name="partyProdName"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true">
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificCounterParty001.assetCode}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input name="assetCode" id="assetCode"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true" />
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificCounterParty001.assetType}">资产负债项目</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="assetType" name="assetType"
                                   class="layui-input form-input input-select"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result="${PBC_ASSET_TYPE}"
                                   allowClear="true" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificCounterParty001.partyProdType}">交易对手产品种类</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="partyProdType" name="partyProdType"
                                   class="layui-input form-input input-select"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result="${PBC_PROD_TYPE}"
                                   allowClear="true" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PbcSpecificCounterParty001.status}">数据状态</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="status" id="status"
                                   class="layui-input form-input input-select"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result="${MAINTAIN_STATUS}"
                                   allowClear="true" />
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/svreport/specificcounterparty/PbcSpecificCounterParty001.js}"
            type="text/javascript"></script>
    <script data-th-inline="javascript" type="text/javascript">

    </script>
</div>
</body>
</html>
