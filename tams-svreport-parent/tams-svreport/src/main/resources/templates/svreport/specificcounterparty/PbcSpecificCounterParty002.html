<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{PbcSpecificCounterParty002}">特定目的载体对手方信息维护新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input type="text" name="pbcUuid" id="pbcUuid" data-th-value='${entity?.pbcUuid}' hidden>
        <input type="text" name="status" id="status" data-th-value='${entity?.status}' hidden>

        <div class="pro-module-wrap">
            <div class="pro-module">
                <div class="pro-module-item">


                    <div class="layui-form-item">

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificCounterParty002.assetType}">资产负债项目</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="assetType" th:name="assetType"
                                       class="layui-input form-input input-select"
                                       maxlength="6"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.assetType}"
                                       data-th-data-result="${PBC_ASSET_TYPE}"
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div id="typeAsset" class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificCounterParty002.assetCode}">资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <input name="assetCode" id="assetCode"
                                       class="layui-input form-input input-lenovoselect" maxlength="51"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.assetCode}"
                                       data-th-data-url="@{/svreport/specificcounterparty/PbcSpecificCounterParty001/queryAssetCode}"
                                       data-idfield="code" data-keyfield="code"
                                       data-showindex = 'false'
                                       data-effectivefieldsalias='{"code":"资产代码","shortName":"资产名称"}'
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div id="typeMark" class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificCounterParty002.assetCode}">资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <input name="assetCode1" id="assetCode1"
                                       class="layui-input form-input input-lenovoselect" maxlength="51"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.assetCode}"
                                       data-th-data-url="@{/svreport/specificcounterparty/PbcSpecificCounterParty001/queryIndentifyMark}"
                                       data-idfield="code" data-keyfield="code"
                                       data-showindex = 'false'
                                       data-effectivefieldsalias='{"code":"识别标识","shortName":"投资者名称"}'
                                       data-th-required="true" />
                            </div>
                        </div>
                        <!--

                        -->

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificCounterParty002.partyOrgName}">交易对手机构名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="partyOrgName" id="partyOrgName"
                                       class="layui-input form-input" maxlength="130"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-initValue="${entity?.partyOrgName}"/>
                            </div>
                        </div>

                    </div>

                    <div class="layui-form-item">

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificCounterParty002.partyProdName}">交易对手产品名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="partyProdName" th:name="partyProdName"
                                       class="layui-input form-input" maxlength="130"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.partyProdName}"
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificCounterParty002.partyProdType}">交易对手产品种类</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="partyProdType" th:name="partyProdType"
                                       class="layui-input form-input" maxlength="130"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.partyProdType}"
                                       data-th-required="true" />
                            </div>
                        </div>

                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificCounterParty002.partyOrgCode}">交易对手机构编码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="partyOrgCode" th:name="partyOrgCode"
                                       class="layui-input form-input" maxlength="201"
                                       data-th-value="${entity?.partyOrgCode}"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-required="true" />
                            </div>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{PbcSpecificCounterParty002.partyProdId}">交易对手产品代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" th:id="partyProdId" th:name="partyProdId"
                                       class="layui-input form-input" maxlength="16"
                                       data-th-value="${entity?.partyProdId}"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-required="true" />
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </form>
    <div class="text-cerow text-center" style="margin: 10px;">
        <a id="PbcSpecificCounterParty002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
        <a id="PbcSpecificCounterParty002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var assetCode = [[${entity?.assetCode}]];
    </script>
    <script data-th-src="@{/js/svreport/specificcounterparty/PbcSpecificCounterParty002.js}" type="text/javascript"></script>
</div>
</body>
</html>
