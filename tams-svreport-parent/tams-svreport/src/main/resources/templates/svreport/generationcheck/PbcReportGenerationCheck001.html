<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title>报表生成检查</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">

            <a id="PbcReportGenerationCheck001_btn_exportReport" class="layui-btn layui-btn-sm btn-export">导出报表</a>

        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">检查时间</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="checkDate" id="checkDate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true" />
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">报表名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="reportName" id="reportName"
                                    class="input-select"
                                    data-th-data-result='${DATA_COLLECT_REPORT_TYPE}'
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    allowClear="true"
                                    multiple="multiple" >
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">字段名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="fieldName" id="fieldName"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true" />
                        </div>
                    </div>

                </div>

                <div class="layui-form-item">

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">规则类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="ruleType" id="ruleType"
                                    class="input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${RULE_TYPE}'
                                    allowClear="true"
                                    multiple="multiple" >
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">规则标识</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="ruleCode" id="ruleCode"
                                   class="layui-input form-input input-select"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${RULE_IDENTIFY}'
                                   allowClear="true"/>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">规则编码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="ruleId" id="ruleId"
                                   class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   allowClear="true" />
                        </div>
                    </div>

                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">校验结果</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="checkFlag" id="checkFlag"
                                   class="layui-input form-input input-select"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${CHECKED_FLAG}'
                                   data-th-value="${checkFlag}"
                                   allowClear="true"/>
                        </div>
                    </div>
                </div>

            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/svreport/generationcheck/PbcReportGenerationCheck001.js}" type="text/javascript"></script>
</div>
</body>
</html>
