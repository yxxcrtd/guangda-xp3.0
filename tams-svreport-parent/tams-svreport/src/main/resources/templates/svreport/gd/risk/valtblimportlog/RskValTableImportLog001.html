<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title>估值表自动导入结果查询</title>
    <style>
        .layui-table tbody tr:hover, .layui-table thead tr, .layui-table-click, .layui-table-header, .layui-table-hover, .layui-table-mend, .layui-table-patch, .layui-table-tool, .layui-table[lay-even] tr:nth-child(even){
            background-color: #d9ecff!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export = "false">
        <a id="RskValTableImportLog001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出估值表文件</a>
        <a id="RskValTableImportLog001_btn_run" class="layui-btn layui-btn-sm btn-default btn-import">文件同步导入</a>
<!--        <a id="RskValTableImportLog001_btn_import" class="layui-btn layui-btn-sm btn-default btn-import">导入估值文件</a>-->
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="ptlId" name="ptlId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/svreport/gd/risk/penetrationmanagement/rskvalrelateimport/RskValRelateImport001/queryGroupIdInfo}"
                                allowClear="true"
                                formatoption="true" multiple>
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">估值日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="valDate" type="text"  name="timeControl"  class="layui-input form-input timeControl input-dateRangeSelect"
                               placeholder="请选择日期区间" />
                    </div>
                </div>

                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">导入状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="status" name="status" class="layui-input form-input input-select" data-th-data-result='${VALTBL_AUTO_IMPORT_STATUS}' data-th-initvalue="${status}" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                        </select>
                    </div>
                </div>

            </div>
        </form>
    </div>
    <div>
        <table id="dataTable"></table>
        
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var  platDate = /*[[${platDate}]]*/'';
    </script>
    <script data-th-src="@{/js/report/gd/risk/valtblimportlog/RskValTableImportLog001.js}" type="text/javascript"></script>
</div>
</body>
</html>
