<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title>委托人明细数据登记表</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area" export="false">
            <a id="ChbConsignorDetailSub001_btn_export" class="layui-btn layui-btn-sm btn-export"><span>导出</span></a>
            <a id="ChbConsignorDetailSub001_btn_exportSubmit" class="layui-btn layui-btn-sm btn-export"><span>导出报送文件</span></a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">月份</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="month" name="month"
                                    class="layui-input form-input input-select"
                                    allowClear="true" required
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${SVR_MONTH}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="prodId" name="prodId"
                                   class="layui-input form-input input-lenovoselect"
                                   allowClear="true"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-idfield="code" data-keyfield="code"
                                   data-effectivefieldsalias='{"code":"产品代码","shortName":"产品登记编码"}'
                                   data-th-data-url="@{/svreport/gd/report/chbconsignordetailsub/ChbConsignorDetailSub001/queryProdInfo}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">投资人类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="holderType" name="holderType"
                                    class="layui-input form-input input-select"
                                    allowClear="true"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${SVR_INVESTOR_TYPE}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">募集方式</label>
                        <div class="layui-input-inline input-inline">
                            <select id="raiseType" name='raiseType'
                                    class="layui-input form-input input-select"
                                    allowClear="true"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${SVR_RAISE_TYPE}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">数据日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="statusDate" name="statusDate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   allowClear="true"
                                   placeholder="请选择时间区间" />
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/svreport/gd/report/chbconsignordetailsub/ChbConsignorDetailSub001.js}" type="text/javascript"></script>
    <script data-th-inline="javascript" type="text/javascript">
        var issueStatusC = /*[[${issueStatusC}]]*/;
        var statusValidE = /*[[${statusValidE}]]*/;
        var issueStatusCName = /*[[${issueStatusCName}]]*/;
    </script>
</div>
</body>
</html>
