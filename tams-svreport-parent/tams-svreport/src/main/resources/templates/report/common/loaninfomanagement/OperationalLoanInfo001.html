<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<title data-th-text="#{OperationalLoanInfo001}">贷款明细信息维护</title>
</head>

<body>
<div layout:fragment="content">
	<div class="form-button-area">
		<a id="OperationalLoanInfo001_btn_add" class="layui-btn layui-btn-sm btn-add btn-default">新建</a>
		<a id="OperationalLoanInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default">删除</a>
		<a id="OperationalLoanInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
		<a id="OperationalLoanInfo001_btn_import01" class="layui-btn layui-btn-sm btn-import btn-default">导入模板下载</a>
	</div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable">数据状态</label>
					<div class="layui-input-inline input-inline">
						<select name="status" id="status"
								class="layui-input form-input input-select"
								data-th-initValue='${entity?.loanState}'
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_STATUS}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable">贷款发放日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="loanVdate" name="loanVdate"
							   class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
							   data-th-placeholder="#{SysCommon.placeholder}">
					</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable">基础资产投向分类</label>
					<div class="layui-input-inline input-inline">
						<select name="assetInvest" id="assetInvest"
								class="layui-input form-input input-select"
								data-th-initValue='${entity?.assetInvest}'
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_CUSTOMER_TYPE1}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable">资产代码</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="assetCode" name="assetCode"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-url="@{/svreport/loaninfomanagement/OperationalLoanInfo002/queryPbcAssetCode}"
								data-th-value="${entity?.assetCode}">
						</select>
					</div>
				</div>
			</div>
		</form>
	</div>
	<div>
		<table class="layui-table" id="dataTable"></table>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
	</script>
	<script data-th-src="@{/js/report/common/loaninfomanagement/OperationalLoanInfo001.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
</div>

</body>

</html>
